name: Java CI

on:
  push:
    tags:
      - 'v*.*.*'

env:
  JAVA_VERSION: '21'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Extract Version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t magibalan07/spring-boot-crud-postgres-adminer:${VERSION} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            magibalan07/spring-boot-crud-postgres-adminer:${VERSION}

      - name: Trigger CD Repository
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CD_REPO_TOKEN }}" \
            https://api.github.com/repos/Magibalan0073/java-k8-cd/dispatches \
            -d '{
              "event_type":"deploy",
              "client_payload":{
                "image_tag":"'"${VERSION}"'"
              }
            }'
