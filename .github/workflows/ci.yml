name: Java CI

on:
  push:
    branches:
      - main

env:
  JAVA_VERSION: '21'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn clean test

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest \
            .

      - name: Push image to DockerHub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-crud-postgres-adminer:latest

      - name: Trigger CD Repository
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CD_REPO_TOKEN }}" \
            https://api.github.com/repos/Magibalan0073/java-cd-repo/dispatches \
            -d '{"event_type":"deploy"}'
